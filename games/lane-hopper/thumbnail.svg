<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c18"/>
      <stop offset="100%" stop-color="#0f1b33"/>
    </linearGradient>
    <linearGradient id="road" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="river" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="car" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="300" fill="url(#bg)"/>

  <!-- Lanes -->
  <rect x="0" y="50" width="400" height="45" fill="#047857" opacity="0.35"/>
  <rect x="0" y="95" width="400" height="50" fill="url(#river)" opacity="0.7"/>
  <rect x="0" y="145" width="400" height="45" fill="#047857" opacity="0.4"/>
  <rect x="0" y="190" width="400" height="55" fill="url(#road)"/>
  
  <!-- Dashed road line -->
  <line x1="0" y1="217" x2="400" y2="217" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="16,14" opacity="0.4"/>

  <!-- River log -->
  <rect x="110" y="105" width="110" height="30" rx="8" fill="#78350f" stroke="#b45309" stroke-width="2"/>
  <rect x="270" y="105" width="90" height="30" rx="8" fill="#78350f" stroke="#b45309" stroke-width="2"/>

  <!-- Road Car -->
  <rect x="60" y="200" width="75" height="34" rx="6" fill="url(#car)" filter="url(#glow)"/>
  <rect x="95" y="205" width="30" height="24" rx="3" fill="#ffffff" opacity="0.3"/>
  <circle cx="72" cy="234" r="5" fill="#0f172a"/>
  <circle cx="123" cy="234" r="5" fill="#0f172a"/>

  <!-- Player Cube with glow -->
  <g transform="translate(190, 140)" filter="url(#glow)">
    <rect x="-18" y="-18" width="36" height="36" rx="8" fill="#10b981" stroke="#34d399" stroke-width="2"/>
    <!-- Eyes -->
    <circle cx="-6" cy="-4" r="3" fill="#ffffff"/>
    <circle cx="6" cy="-4" r="3" fill="#ffffff"/>
    <circle cx="-5" cy="-4" r="1.5" fill="#064e3b"/>
    <circle cx="7" cy="-4" r="1.5" fill="#064e3b"/>
  </g>

  <!-- Title & Subtitle -->
  <text x="200" y="42" font-family="system-ui, sans-serif" font-size="28" font-weight="900" fill="#34d399" text-anchor="middle" filter="url(#glow)" letter-spacing="2">LANE HOPPER</text>
  <text x="200" y="278" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#94a3b8" text-anchor="middle" letter-spacing="3">ENDLESS CROSSY ARCADE</text>
</svg>
