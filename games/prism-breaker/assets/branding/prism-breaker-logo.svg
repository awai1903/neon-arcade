<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 140" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="pb-grad-prism" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="45%" stop-color="#06b6d4" />
      <stop offset="85%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="pb-text-prism" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="45%" stop-color="#d1fae5" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="pb-text-breaker" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#e0f2fe" />
      <stop offset="80%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="pb-glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Left Refractive Hex Prism Emblem -->
  <g transform="translate(18, 14)">
    <!-- Base Hexagon Frame -->
    <polygon points="50,4 90,26 90,74 50,96 10,74 10,26" fill="#041215" stroke="url(#pb-grad-prism)" stroke-width="2.5" />
    <!-- Crystalline Facets -->
    <polygon points="50,4 90,26 50,50" fill="#06b6d4" opacity="0.3" />
    <polygon points="90,26 90,74 50,50" fill="#a855f7" opacity="0.4" />
    <polygon points="90,74 50,96 50,50" fill="#ec4899" opacity="0.35" />
    <polygon points="50,96 10,74 50,50" fill="#10b981" opacity="0.5" />
    <polygon points="10,74 10,26 50,50" fill="#34d399" opacity="0.35" />
    <polygon points="10,26 50,4 50,50" fill="#38bdf8" opacity="0.45" />

    <!-- Trajectory Beam & Orb -->
    <path d="M22 84 L50 50 L78 28" stroke="#ffffff" stroke-width="1.8" stroke-dasharray="4 4" filter="url(#pb-glow)" />
    <circle cx="50" cy="50" r="5" fill="#ffffff" filter="url(#pb-glow)" />
    <circle cx="78" cy="28" r="4" fill="#a855f7" />
  </g>

  <!-- Wordmark "PRISM BREAKER 2077" -->
  <g transform="translate(132, 22)">
    <!-- Laser Aim Grid Line -->
    <path d="M-8 46 L385 46" stroke="#10b981" stroke-width="1.5" stroke-dasharray="16 8" opacity="0.3" />
    <path d="M8 64 L395 64" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="20 12" opacity="0.25" />

    <!-- Subtitle Flag -->
    <text x="2" y="24" font-family="'Outfit', 'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="13" letter-spacing="6" fill="#34d399">
      SYNTH-PHYSICS DEMOLITION
    </text>

    <!-- "PRISM" Wordmark -->
    <text x="0" y="66" font-family="'Outfit', 'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="46" letter-spacing="2" fill="url(#pb-text-prism)" font-style="italic" filter="drop-shadow(0 4px 14px rgba(16, 185, 129, 0.45))">
      PRISM
    </text>

    <!-- "BREAKER" Wordmark -->
    <text x="162" y="66" font-family="'Outfit', 'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="46" letter-spacing="2" fill="url(#pb-text-breaker)" font-style="italic" filter="drop-shadow(0 4px 16px rgba(6, 182, 212, 0.45))">
      BREAKER
    </text>

    <!-- "2077" Cyber Badge -->
    <text x="372" y="66" font-family="'JetBrains Mono', monospace" font-weight="900" font-size="34" letter-spacing="1" fill="#ec4899" font-style="italic">
      2077
    </text>

    <!-- Subtitle Bar -->
    <g transform="translate(2, 78)">
      <rect x="0" y="0" width="370" height="20" rx="4" fill="#061a1b" stroke="#10b981" stroke-width="1" stroke-opacity="0.5" />
      <circle cx="10" cy="10" r="3" fill="#34d399" />
      <text x="22" y="14" font-family="'JetBrains Mono', monospace, sans-serif" font-weight="700" font-size="9" letter-spacing="3" fill="#a7f3d0">
        DYNAMIC COMBO STREAKS · POWER LASERS · 99 BALLS
      </text>
    </g>
  </g>
</svg>
