<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="pb-icon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <radialGradient id="pb-icon-bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#030c10" stop-opacity="0.95" />
    </radialGradient>
  </defs>

  <rect width="128" height="128" rx="28" fill="#041217" stroke="url(#pb-icon-grad)" stroke-width="3" />
  <rect width="128" height="128" rx="28" fill="url(#pb-icon-bg)" />

  <!-- Outer Faceted Hexagon -->
  <polygon points="64,16 106,40 106,88 64,112 22,88 22,40" fill="#061c24" stroke="url(#pb-icon-grad)" stroke-width="2.5" />

  <!-- Prismatic Triangles -->
  <polygon points="64,16 106,40 64,64" fill="#06b6d4" opacity="0.4" />
  <polygon points="106,40 106,88 64,64" fill="#a855f7" opacity="0.45" />
  <polygon points="106,88 64,112 64,64" fill="#ec4899" opacity="0.35" />
  <polygon points="64,112 22,88 64,64" fill="#10b981" opacity="0.5" />
  <polygon points="22,88 22,40 64,64" fill="#34d399" opacity="0.35" />
  <polygon points="22,40 64,16 64,64" fill="#38bdf8" opacity="0.45" />

  <!-- Glowing Core Ball & Refracted Laser -->
  <line x1="32" y1="96" x2="64" y2="64" stroke="#ffffff" stroke-width="2.5" />
  <line x1="64" y1="64" x2="96" y2="34" stroke="#ffffff" stroke-width="2" stroke-dasharray="3 3" />
  <circle cx="64" cy="64" r="7" fill="#ffffff" />
  <circle cx="96" cy="34" r="4" fill="#a855f7" />
</svg>
