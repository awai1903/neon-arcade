<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060914"/>
      <stop offset="100%" stop-color="#0c122b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="400" height="300" fill="url(#bg)"/>

  <!-- Bricks -->
  <g filter="url(#glow)">
    <!-- Row 1: Magenta -->
    <rect x="40" y="70" width="65" height="20" rx="4" fill="#f43f5e"/>
    <rect x="115" y="70" width="65" height="20" rx="4" fill="#f43f5e"/>
    <rect x="190" y="70" width="65" height="20" rx="4" fill="#f43f5e"/>
    <rect x="265" y="70" width="65" height="20" rx="4" fill="#f43f5e"/>

    <!-- Row 2: Violet -->
    <rect x="40" y="100" width="65" height="20" rx="4" fill="#a855f7"/>
    <rect x="115" y="100" width="65" height="20" rx="4" fill="#a855f7"/>
    <rect x="190" y="100" width="65" height="20" rx="4" fill="#a855f7"/>
    <rect x="265" y="100" width="65" height="20" rx="4" fill="#a855f7"/>

    <!-- Row 3: Cyan -->
    <rect x="40" y="130" width="65" height="20" rx="4" fill="#00d4ff"/>
    <rect x="190" y="130" width="65" height="20" rx="4" fill="#00d4ff"/>
    <rect x="265" y="130" width="65" height="20" rx="4" fill="#00d4ff"/>
  </g>

  <!-- Ball Trail and Ball -->
  <line x1="150" y1="210" x2="140" y2="155" stroke="#00d4ff" stroke-width="3" stroke-dasharray="4,6" opacity="0.6"/>
  <circle cx="140" cy="150" r="10" fill="#ffffff" filter="url(#glow)"/>
  <circle cx="140" cy="150" r="6" fill="#38bdf8"/>

  <!-- Paddle -->
  <g filter="url(#glow)">
    <rect x="110" y="235" width="120" height="14" rx="7" fill="#00d4ff"/>
    <rect x="135" y="237" width="70" height="4" rx="2" fill="#ffffff"/>
  </g>

  <!-- Title -->
  <text x="200" y="44" font-family="system-ui, sans-serif" font-size="28" font-weight="900" fill="#00d4ff" text-anchor="middle" filter="url(#glow)" letter-spacing="2">BRICK BLITZ</text>
  <text x="200" y="282" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#94a3b8" text-anchor="middle" letter-spacing="3">NEON BREAKOUT ACTION</text>
</svg>
