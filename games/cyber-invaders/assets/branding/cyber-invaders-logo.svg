<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 140" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="ci-grad-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#84cc16" />
      <stop offset="45%" stop-color="#06b6d4" />
      <stop offset="85%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="ci-text-cyber" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="45%" stop-color="#d9f99d" />
      <stop offset="100%" stop-color="#84cc16" />
    </linearGradient>
    <linearGradient id="ci-text-invaders" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#e0f2fe" />
      <stop offset="80%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="ci-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Left Alien Dreadnought Emblem -->
  <g transform="translate(18, 12)">
    <!-- Hex Shield Frame -->
    <polygon points="50,4 90,24 90,76 50,96 10,76 10,24" fill="#05101a" stroke="url(#ci-grad-primary)" stroke-width="2.5" />

    <!-- Vector Invader Alien Head -->
    <path d="M26 34 L74 34 L82 46 L76 64 L66 64 L62 56 L38 56 L34 64 L24 64 L18 46 Z" fill="#84cc16" filter="url(#ci-glow)" />
    <!-- Glowing Red Eyes -->
    <rect x="32" y="42" width="8" height="6" fill="#030712" />
    <rect x="34" y="44" width="4" height="4" fill="#ec4899" />
    <rect x="60" y="42" width="8" height="6" fill="#030712" />
    <rect x="62" y="44" width="4" height="4" fill="#ec4899" />
    <!-- Antennas -->
    <line x1="34" y1="34" x2="24" y2="22" stroke="#84cc16" stroke-width="2" />
    <circle cx="24" cy="22" r="2.5" fill="#a3e635" />
    <line x1="66" y1="34" x2="76" y2="22" stroke="#84cc16" stroke-width="2" />
    <circle cx="76" cy="22" r="2.5" fill="#a3e635" />
    <!-- Plasma Laser Beams downwards -->
    <line x1="38" y1="68" x2="38" y2="84" stroke="#06b6d4" stroke-width="2.5" />
    <line x1="62" y1="68" x2="62" y2="84" stroke="#06b6d4" stroke-width="2.5" />
  </g>

  <!-- Wordmark "CYBER INVADERS" -->
  <g transform="translate(132, 22)">
    <!-- Space Grid Lines -->
    <path d="M-8 46 L385 46" stroke="#84cc16" stroke-width="1.5" stroke-dasharray="16 8" opacity="0.3" />
    <path d="M8 64 L395 64" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="20 12" opacity="0.25" />

    <!-- Subtitle Flag -->
    <text x="2" y="24" font-family="'Outfit', 'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="13" letter-spacing="6" fill="#a3e635">
      TACTICAL SPACE DEFENSE
    </text>

    <!-- "CYBER" Wordmark -->
    <text x="0" y="66" font-family="'Outfit', 'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="46" letter-spacing="2" fill="url(#ci-text-cyber)" font-style="italic" filter="drop-shadow(0 4px 14px rgba(132, 204, 22, 0.45))">
      CYBER
    </text>

    <!-- "INVADERS" Wordmark -->
    <text x="166" y="66" font-family="'Outfit', 'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="46" letter-spacing="2" fill="url(#ci-text-invaders)" font-style="italic" filter="drop-shadow(0 4px 16px rgba(6, 182, 212, 0.45))">
      INVADERS
    </text>

    <!-- Subtitle Bar -->
    <g transform="translate(2, 78)">
      <rect x="0" y="0" width="370" height="20" rx="4" fill="#081720" stroke="#84cc16" stroke-width="1" stroke-opacity="0.5" />
      <circle cx="10" cy="10" r="3" fill="#a3e635" />
      <text x="22" y="14" font-family="'JetBrains Mono', monospace, sans-serif" font-weight="700" font-size="9" letter-spacing="3" fill="#bef264">
        ARCADE SHMUP · DESTRUCTIBLE BUNKERS · UFO SWEEPS
      </text>
    </g>
  </g>
</svg>
