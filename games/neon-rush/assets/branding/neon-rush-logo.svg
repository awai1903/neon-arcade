<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 140" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="nr-cyan-violet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="45%" stop-color="#38bdf8" />
      <stop offset="75%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="nr-pink-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#00f0ff" />
    </linearGradient>
    <linearGradient id="nr-text-fill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#e0f2fe" />
      <stop offset="80%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="nr-rush-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#fdf4ff" />
      <stop offset="70%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="logo-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Left Speed Emblem -->
  <g transform="translate(15, 12)">
    <polygon points="50,6 92,26 92,74 50,96 8,74 8,26" fill="#080e22" stroke="url(#nr-cyan-violet)" stroke-width="2.5" />
    <path d="M24 34 L50 18 L76 34 L66 42 L50 32 L34 42 Z" fill="url(#nr-cyan-violet)" opacity="0.4" />
    <path d="M20 54 L50 36 L80 54 L70 62 L50 50 L30 62 Z" fill="url(#nr-cyan-violet)" opacity="0.8" />
    <path d="M50 44 L72 80 L50 70 L28 80 Z" fill="url(#nr-pink-glow)" filter="url(#logo-glow)" />
    <circle cx="50" cy="62" r="3" fill="#ffffff" />
  </g>

  <!-- Wordmark "NEON RUSH" -->
  <g transform="translate(130, 20)">
    <!-- Speed Motion Trails behind Text -->
    <path d="M-15 48 L370 48" stroke="#00f0ff" stroke-width="1.5" stroke-dasharray="16 8" opacity="0.35" />
    <path d="M5 64 L390 64" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="24 12" opacity="0.25" />

    <!-- "NEON" Custom Wordmark -->
    <text x="0" y="58" font-family="'Outfit', 'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="56" letter-spacing="3" fill="url(#nr-text-fill)" font-style="italic" filter="drop-shadow(0 4px 12px rgba(0, 240, 255, 0.3))">
      NEON
    </text>

    <!-- "RUSH" Custom Wordmark with Color Shift -->
    <text x="178" y="58" font-family="'Outfit', 'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="56" letter-spacing="3" fill="url(#nr-rush-fill)" font-style="italic" filter="drop-shadow(0 4px 14px rgba(168, 85, 247, 0.45))">
      RUSH
    </text>

    <!-- "CITY ESCAPE" Subtitle Bar -->
    <g transform="translate(4, 76)">
      <!-- Badge Backing -->
      <polygon points="0,0 210,0 200,24 0,24" fill="#0c122b" stroke="#38bdf8" stroke-width="1" />
      <polygon points="0,0 6,0 6,24 0,24" fill="#00f0ff" />
      <!-- Subtitle Text -->
      <text x="16" y="16" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="800" fill="#38bdf8" letter-spacing="4">
        CITY ESCAPE
      </text>
      <!-- Tech accents -->
      <rect x="160" y="8" width="6" height="8" fill="#ec4899" />
      <rect x="170" y="8" width="16" height="8" fill="#00f0ff" opacity="0.7" />
    </g>

    <!-- 3D Endless Runner tag -->
    <text x="240" y="93" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="600" fill="#64748b" letter-spacing="2">
      // 3D HYPER-RUNNER
    </text>
  </g>
</svg>
