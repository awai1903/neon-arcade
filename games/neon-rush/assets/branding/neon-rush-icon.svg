<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="neon-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="core-glow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#00f0ff" />
    </linearGradient>
    <filter id="bloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Hexagonal Tech Shield Background -->
  <polygon points="60,8 108,32 108,88 60,112 12,88 12,32" fill="#070c1e" stroke="url(#neon-glow)" stroke-width="2.5" />
  
  <!-- Outer Speed Chevron 1 -->
  <path d="M30 40 L60 22 L90 40 L78 48 L60 36 L42 48 Z" fill="url(#neon-glow)" opacity="0.4" />
  
  <!-- Middle Speed Chevron 2 -->
  <path d="M26 62 L60 42 L94 62 L82 70 L60 56 L38 70 Z" fill="url(#neon-glow)" opacity="0.8" />
  
  <!-- Dynamic Runner Delta Core -->
  <path d="M60 52 L86 94 L60 82 L34 94 Z" fill="url(#core-glow)" filter="url(#bloom)" />
  
  <!-- Central Energy Spark -->
  <circle cx="60" cy="74" r="3.5" fill="#ffffff" />
  
  <!-- Speed Lines -->
  <line x1="20" y1="52" x2="8" y2="52" stroke="#00f0ff" stroke-width="2" stroke-linecap="round" opacity="0.8" />
  <line x1="24" y1="68" x2="6" y2="68" stroke="#a855f7" stroke-width="2" stroke-linecap="round" opacity="0.6" />
  <line x1="100" y1="52" x2="112" y2="52" stroke="#00f0ff" stroke-width="2" stroke-linecap="round" opacity="0.8" />
  <line x1="96" y1="68" x2="114" y2="68" stroke="#a855f7" stroke-width="2" stroke-linecap="round" opacity="0.6" />
</svg>
