<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 140" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="nvd-grad-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="40%" stop-color="#ec4899" />
      <stop offset="80%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="nvd-text-vector" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="45%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="nvd-text-drift" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#fbcfe8" />
      <stop offset="85%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#be185d" />
    </linearGradient>
    <filter id="nvd-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Left Wireframe Tunnel & Ship Emblem -->
  <g transform="translate(18, 12)">
    <!-- Outer Octagon Tunnel Ring -->
    <polygon points="50,4 88,20 96,58 78,92 50,98 22,92 4,58 12,20" fill="#080718" stroke="url(#nvd-grad-primary)" stroke-width="2.5" />
    <!-- Inner Perspective Tunnel Rings -->
    <polygon points="50,22 75,32 80,56 68,78 50,82 32,78 20,56 25,32" fill="none" stroke="#ec4899" stroke-width="1.5" opacity="0.6" />
    <polygon points="50,38 64,44 67,56 60,68 50,70 40,68 33,56 36,44" fill="none" stroke="#f59e0b" stroke-width="1.5" opacity="0.75" />
    <!-- Tunnel Grid Rays -->
    <line x1="50" y1="56" x2="88" y2="20" stroke="#06b6d4" stroke-width="1" opacity="0.5" />
    <line x1="50" y1="56" x2="12" y2="20" stroke="#06b6d4" stroke-width="1" opacity="0.5" />
    <line x1="50" y1="56" x2="78" y2="92" stroke="#ec4899" stroke-width="1" opacity="0.5" />
    <line x1="50" y1="56" x2="22" y2="92" stroke="#ec4899" stroke-width="1" opacity="0.5" />
    <!-- Drifting Vector Ship -->
    <polygon points="50,42 66,66 50,60 34,66" fill="#fef08a" stroke="#f59e0b" stroke-width="1.5" filter="url(#nvd-glow)" />
    <!-- Twin Thruster Flames -->
    <polygon points="42,63 46,72 44,62" fill="#ec4899" />
    <polygon points="58,63 54,72 56,62" fill="#ec4899" />
  </g>

  <!-- Wordmark "NEON VECTOR DRIFT" -->
  <g transform="translate(132, 22)">
    <!-- Speed Lines -->
    <path d="M-10 46 L385 46" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="18 10" opacity="0.3" />
    <path d="M10 62 L395 62" stroke="#ec4899" stroke-width="1.5" stroke-dasharray="24 14" opacity="0.35" />

    <!-- "NEON" Small Cyber Subtitle -->
    <text x="2" y="24" font-family="'Outfit', 'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="14" letter-spacing="6" fill="#06b6d4">
      NEON HYPERDRIVE
    </text>

    <!-- "VECTOR" Typography -->
    <text x="0" y="66" font-family="'Outfit', 'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="46" letter-spacing="2" fill="url(#nvd-text-vector)" font-style="italic" filter="drop-shadow(0 4px 14px rgba(245, 158, 11, 0.45))">
      VECTOR
    </text>

    <!-- "DRIFT" Typography -->
    <text x="182" y="66" font-family="'Outfit', 'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="46" letter-spacing="3" fill="url(#nvd-text-drift)" font-style="italic" filter="drop-shadow(0 4px 16px rgba(236, 72, 153, 0.5))">
      DRIFT
    </text>

    <!-- Subtitle Bar -->
    <g transform="translate(2, 78)">
      <rect x="0" y="0" width="370" height="20" rx="4" fill="#0f0e26" stroke="#ec4899" stroke-width="1" stroke-opacity="0.5" />
      <circle cx="10" cy="10" r="3" fill="#f59e0b" />
      <text x="22" y="14" font-family="'JetBrains Mono', monospace, sans-serif" font-weight="700" font-size="9" letter-spacing="3" fill="#cbd5e1">
        60 FPS · SUB-PIXEL LERP · TACTICAL SHIELD PULSE
      </text>
    </g>
  </g>
</svg>
