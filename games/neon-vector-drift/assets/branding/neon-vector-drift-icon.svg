  <polygon points="64,32 88,44 94,68 82,92 64,96 46,92 34,68 40,44" fill="none" stroke="#ec4899" stroke-width="1.5" opacity="0.6" />
  <polygon points="64,48 76,54 80,66 74,78 64,80 54,78 48,66 52,54" fill="none" stroke="#f59e0b" stroke-width="1.5" opacity="0.8" />

  <!-- Perspective rays -->
  <line x1="64" y1="66" x2="102" y2="32" stroke="#06b6d4" stroke-width="1" opacity="0.5" />
  <line x1="64" y1="66" x2="26" y2="32" stroke="#06b6d4" stroke-width="1" opacity="0.5" />

  <!-- Drifting Vector Ship -->
