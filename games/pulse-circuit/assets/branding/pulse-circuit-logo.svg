<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 140" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="pc-grad-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="45%" stop-color="#8b5cf6" />
      <stop offset="85%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="pc-text-pulse" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="45%" stop-color="#cffafe" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="pc-text-circuit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#ede9fe" />
      <stop offset="80%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <filter id="pc-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Left Circuit CPU / Node Emblem -->
  <g transform="translate(18, 12)">
    <polygon points="50,4 90,24 90,76 50,96 10,76 10,24" fill="#040914" stroke="url(#pc-grad-primary)" stroke-width="2.5" />

    <!-- Circuit Trace Lines -->
    <path d="M22 36 L40 36 L50 46 L70 46 L78 36" stroke="#06b6d4" stroke-width="2" stroke-linecap="round" />
    <path d="M22 64 L42 64 L50 54 L68 54 L78 64" stroke="#8b5cf6" stroke-width="2" stroke-linecap="round" />
    <circle cx="22" cy="36" r="3" fill="#06b6d4" />
    <circle cx="78" cy="36" r="3" fill="#06b6d4" />
    <circle cx="22" cy="64" r="3" fill="#8b5cf6" />
    <circle cx="78" cy="64" r="3" fill="#8b5cf6" />

    <!-- Central Micro-Core Node -->
    <rect x="42" y="42" width="16" height="16" rx="3" fill="#082f49" stroke="#38bdf8" stroke-width="1.5" filter="url(#pc-glow)" />
    <circle cx="50" cy="50" r="4" fill="#f59e0b" />
    <!-- Quantum Pulse Spark -->
    <line x1="50" y1="20" x2="50" y2="40" stroke="#f59e0b" stroke-width="1.8" stroke-dasharray="3 3" />
    <line x1="50" y1="60" x2="50" y2="80" stroke="#ec4899" stroke-width="1.8" stroke-dasharray="3 3" />
  </g>

  <!-- Wordmark "PULSE CIRCUIT" -->
  <g transform="translate(132, 22)">
    <!-- Circuit Grid Lines -->
    <path d="M-8 46 L385 46" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="16 8" opacity="0.3" />
    <path d="M8 64 L395 64" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="20 12" opacity="0.25" />

    <!-- Subtitle Flag -->
    <text x="2" y="24" font-family="'Outfit', 'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="13" letter-spacing="6" fill="#38bdf8">
      ELECTROMAGNETIC PUZZLE HARMONICS
    </text>

    <!-- "PULSE" Wordmark -->
    <text x="0" y="66" font-family="'Outfit', 'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="46" letter-spacing="2" fill="url(#pc-text-pulse)" font-style="italic" filter="drop-shadow(0 4px 14px rgba(6, 182, 212, 0.45))">
      PULSE
    </text>

    <!-- "CIRCUIT" Wordmark -->
    <text x="162" y="66" font-family="'Outfit', 'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="46" letter-spacing="2" fill="url(#pc-text-circuit)" font-style="italic" filter="drop-shadow(0 4px 16px rgba(139, 92, 246, 0.45))">
      CIRCUIT
    </text>

    <!-- "OVERCLOCK" Badge -->
    <text x="368" y="66" font-family="'JetBrains Mono', monospace" font-weight="900" font-size="28" letter-spacing="2" fill="#f59e0b" font-style="italic">
      OC
    </text>

    <!-- Subtitle Bar -->
    <g transform="translate(2, 78)">
      <rect x="0" y="0" width="370" height="20" rx="4" fill="#051524" stroke="#06b6d4" stroke-width="1" stroke-opacity="0.5" />
      <circle cx="10" cy="10" r="3" fill="#38bdf8" />
      <text x="22" y="14" font-family="'JetBrains Mono', monospace, sans-serif" font-weight="700" font-size="9" letter-spacing="3" fill="#7dd3fc">
        HARMONIC NODES · LOGIC GATES · QUANTUM OVERLOAD
      </text>
    </g>
  </g>
</svg>
